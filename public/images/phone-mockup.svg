<svg width="288" height="580" viewBox="0 0 288 580" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone Frame -->
  <rect x="4" y="4" width="280" height="572" rx="36" fill="#1a1a1a"/>
  <rect x="12" y="12" width="264" height="556" rx="28" fill="white"/>
  
  <!-- Status Bar -->
  <rect x="12" y="12" width="264" height="40" rx="28" fill="#e53935"/>
  <text x="144" y="38" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Notes</text>
  
  <!-- Content Area -->
  <rect x="24" y="64" width="240" height="480" fill="#f9f9f9"/>
  
  <!-- List Items -->
  <rect x="36" y="80" width="216" height="40" rx="8" fill="white" stroke="#eee"/>
  <text x="56" y="106" font-family="Arial, sans-serif" font-size="12" fill="#666">e.g., 2 garden eggs</text>
  
  <rect x="36" y="128" width="216" height="40" rx="8" fill="white" stroke="#eee"/>
  <text x="56" y="154" font-family="Arial, sans-serif" font-size="12" fill="#666">e.g., 1 koobi</text>
  
  <rect x="36" y="176" width="216" height="40" rx="8" fill="white" stroke="#eee"/>
  <text x="56" y="202" font-family="Arial, sans-serif" font-size="12" fill="#666">e.g., 3 tomatoes</text>
  
  <!-- Bottom Navigation -->
  <rect x="12" y="520" width="264" height="48" fill="white"/>
  <circle cx="144" cy="544" r="20" fill="#e53935"/>
</svg>